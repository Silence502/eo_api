spring.application.name=app
server.port=8000

# DataSource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eo_db
spring.datasource.username=dev
spring.datasource.password=${DB_PASSWORD:azerty}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
cors.allowed-origins=http://localhost:5173

# CSP - en production, remplacer par les origines réelles
# Ex: default-src 'self'; connect-src 'self' https://api.mondomaine.com; frame-ancestors 'none'; form-action 'self'
csp.policy=default-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; form-action 'self'

jwt.secret=${JWT_SECRET:aGVsbG8td29ybGQtdGhpcy1pcy1hLXNlY3JldC1rZXktMjU2LWJpdHMhISE=}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Avatar upload
upload.avatar-dir=uploads/avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
